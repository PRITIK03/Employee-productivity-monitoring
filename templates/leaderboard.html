<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard - Productivity Pulse Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">
    <div class="max-w-4xl mx-auto bg-white rounded-lg shadow-lg p-6">
        <h2 class="text-2xl font-bold text-gray-800 mb-4">Top Employees</h2>
        <table class="table-auto w-full text-left">
            <thead>
                <tr class="bg-indigo-100">
                    <th class="px-4 py-2">Rank</th>
                    <th class="px-4 py-2">Employee ID</th>
                    <th class="px-4 py-2">Score</th>
                </tr>
            </thead>
            <tbody>
                {% for emp in top_employees %}
                <tr class="border-t">
                    <td class="px-4 py-2">{{ loop.index }}</td>
                    <td class="px-4 py-2">{{ emp[0] }}</td>
                    <td class="px-4 py-2">{{ emp[1]['scores']['total'] | round(2) }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        <div class="mt-4 flex justify-between items-center">
            <a href="/" class="text-indigo-600 hover:underline">Back to Home</a>
            <a href="https://app.powerbi.com/view?r=eyJrIjoiN2RmOGI2ZGUtZjhjOC00Mzg4LWJhMjAtYzM1MThhNWI0MWU2IiwidCI6IjQ3NTIxNzEzLTgyMmYtNGZhNS04MDg4LTg3OThiYzJhZWQ5YSJ9" 
               target="_blank"
               rel="noopener noreferrer"
               class="text-indigo-600 hover:underline flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" class="text-[#F2C811]">
                    <path d="M3 18.5V5.5C3 4.4 3.9 3.5 5 3.5H19C20.1 3.5 21 4.4 21 5.5V18.5C21 19.6 20.1 20.5 19 20.5H5C3.9 20.5 3 19.6 3 18.5Z"/>
                    <path fill="#fff" d="M6.666 15.833h3.334v-3.334H6.666v3.334Zm0-5h3.334V7.5H6.666v3.333Zm5 5h3.334v-3.334h-3.334v3.334Zm0-5h3.334V7.5h-3.334v3.333Zm5 5h3.334v-3.334h-3.334v3.334Zm0-5h3.334V7.5h-3.334v3.333Z"/>
                </svg>
                View Power BI Analytics
            </a>
        </div>
    </div>
</body>
</html>
